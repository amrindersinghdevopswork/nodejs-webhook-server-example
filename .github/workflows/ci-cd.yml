name: CI/CD Pipeline

on:
  push:
    branches: [Amrinder-webhook, main]
  pull_request:
    branches: [Amrinder-webhook, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test
        # Note: If no tests exist yet, Jest might fail unless you configure it to pass on no tests.
        # Adding --passWithNoTests prevents failure on an empty test suite.
        env:
          CI: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx tsc

  docker-and-deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/Amrinder-webhook' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }} # e.g., us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: webhook-server
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

      - name: Deploy to Amazon ECS
        run: |
          # This is a placeholder for updating an ECS service.
          # You will need to replace 'my-cluster' and 'my-service' with your actual AWS ECS resource names.
          aws ecs update-service --cluster my-cluster --service my-service --force-new-deployment
